<!DOCTYPE html>

<html lang="ru">

<head>

  <meta charset="UTF-8" />

  <style>

    body { margin: 0; padding: 12px 14px; width: 280px; max-height: 560px; overflow-y: auto; font: 14px/20px Roboto, Arial, sans-serif; color: #0f0f0f; background: #fff; }

    h1 { margin: 0 0 10px; font-size: 16px; font-weight: 500; }

    h2 { margin: 14px 0 8px; font-size: 13px; font-weight: 500; color: #606060; }

    label { display: flex; align-items: center; gap: 10px; padding: 8px 0; cursor: pointer; }

    label.setting { flex-wrap: wrap; margin: 0 -6px; padding: 8px 6px; border-radius: 8px; }

    label.setting:hover { background: #f2f2f2; }

    label.setting:hover::after {

      content: attr(data-hint);

      flex: 1 0 100%;

      margin-top: 6px;

      padding: 8px 10px;

      border-radius: 8px;

      background: #0f0f0f;

      color: #fff;

      font-size: 12px;

      font-weight: 400;

      line-height: 1.4;

    }

    label.row-tight { padding: 4px 0; font-size: 13px; }

    label.row-number { padding: 6px 0; gap: 8px; font-size: 13px; cursor: default; }

    label.row-number input[type="number"] {

      width: 52px; padding: 4px 6px; border: 1px solid #ccc; border-radius: 6px;

      font: inherit; text-align: center;

    }

    input[type="checkbox"], input[type="radio"] { width: 16px; height: 16px; flex-shrink: 0; }

    .backup-actions { display: flex; gap: 8px; margin-top: 6px; }

    button {

      flex: 1; border: 0; border-radius: 8px; padding: 8px 10px; font: 500 13px Roboto, Arial, sans-serif;

      cursor: pointer; background: #f2f2f2; color: #0f0f0f;

    }

    button:hover { background: #e5e5e5; }

    #backupStatus { margin: 8px 0 0; min-height: 20px; font-size: 12px; line-height: 1.35; color: #606060; }

    hr { border: 0; border-top: 1px solid #e5e5e5; margin: 12px 0 0; }

  </style>

</head>

<body>

  <h1>Улучшения</h1>

  <label class="setting" data-hint="Размывает обложки видео. Наведите курсор на карточку — блюр снимается, и превью видно."><input type="checkbox" id="blur" /> Блюр превью</label>

  <label class="setting" data-hint="Когда курсор на карточке, YouTube проигрывает короткий ролик. Выключите, если это мешает."><input type="checkbox" id="hoverPlay" /> Превью при наведении</label>

  <label class="setting" data-hint="Размывает аватарки каналов и авторов. При наведении на аватар блюр снимается."><input type="checkbox" id="blurAvatars" /> Блюр аватаров</label>

  <label class="setting" data-hint="Размывает ссылки на Telegram и другие соцсети. При наведении ссылку можно прочитать."><input type="checkbox" id="blurLinks" /> Блюр ссылок</label>

  <label class="setting" data-hint="На карточке появляются кнопки «Блок видео» и «Блок канала». Заблокированное не открывается и остаётся размытым."><input type="checkbox" id="blockEnabled" /> Блок видео</label>

  <label class="setting" data-hint="Считает, сколько раз вы наводили курсор на карточку, и показывает это число на превью."><input type="checkbox" id="viewsEnabled" /> Счётчик просмотров</label>

  <label class="setting" data-hint="Видео с пометкой «Сделать доступным» показывается с обычной обложкой, без блюра."><input type="checkbox" id="publicAvailable" /> Доступные без блюра</label>

  <label class="setting" data-hint="Убирает полки Shorts и пункт Shorts в меню. Если выключить, страница перезагрузится."><input type="checkbox" id="hideShorts" checked /> Скрывать Shorts</label>

  <label class="setting" data-hint="Прячет видео, которое вы уже видели больше заданного числа раз. «Показать» возвращает карточку. Доступные видео не скрываются."><input type="checkbox" id="autoHideEnabled" checked /> Автоскрытие</label>

  <label class="setting row-number" id="autoHideAfterRow" data-hint="После скольких наведений карточка скрывается. Работает, только когда автоскрытие включено.">После <input type="number" id="autoHideAfter" min="1" max="99" step="1" value="5" /> раз</label>

  <label class="setting" data-hint="После «Блок канала» на главной YouTube получает ту же команду, что и пункт «Не рекомендовать канал». Отдельной кнопки нет. В поиске и на странице видео это не срабатывает."><input type="checkbox" id="dontRecommendEnabled" /> Не рекомендовать</label>



  <hr />

  <h2>База данных</h2>

  <div class="backup-actions">

    <button type="button" id="exportBtn">Выгрузить</button>

    <button type="button" id="importBtn">Загрузить</button>

  </div>

  <input type="file" id="importFile" accept="application/json,.json" hidden />

  <label class="row-tight"><input type="radio" name="importMode" id="importMerge" value="merge" checked /> Объединить с текущей</label>

  <label class="row-tight"><input type="radio" name="importMode" id="importReplace" value="replace" /> Заменить полностью</label>

  <p id="backupStatus"></p>



  <script src="popup.js"></script>

</body>

</html>
